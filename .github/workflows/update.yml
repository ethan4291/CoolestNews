# Rebuilds CoolestNews with fresh news and publishes it to GitHub Pages.
name: Update news

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a bit late when busy)
  push:
    branches: [main]
  workflow_dispatch:          # lets you click "Run workflow" on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # let a deploy that's under way finish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Fetch the news and build the site
        run: python build.py
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
